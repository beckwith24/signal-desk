# Screens candidate tickers (growth stocks, Solana and other coins) before adding them to the watchlist.
# Actions tab -> "Candidate screen" -> Run workflow (~5-10 min). Results in research/candidates.md.
name: Candidate screen

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Screen
        env:
          SIGNAL_DESK_DB: /tmp/screen.db
        run: python screen_candidates.py

      - name: Save results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candidates.md research/candidates.json
          git commit -m "Candidate screen results" || exit 0
          git checkout -- .   # drop side files the screen touched (e.g. ath.json) so the rebase can run
          ok=0; for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep 5; done; [ "$ok" = 1 ]
