# Tests relative strength ranking, volatility sizing and earnings drift on the S&P 100 and ~30 coins.
# Actions tab -> "Factor test" -> Run workflow (~10-15 min). Results in research/factors.md.
name: Factor test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  factors:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt lxml

      - name: Test
        env:
          SIGNAL_DESK_DB: /tmp/screen.db
        run: python factor_research.py

      - name: Save results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/factors.md research/factors.json
          git commit -m "Factor test results" || exit 0
          git checkout -- .   # drop side files the test touched (e.g. ath.json) so the rebase can run
          ok=0; for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep 5; done; [ "$ok" = 1 ]
