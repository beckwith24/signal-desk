# Tests whether waiting for 4H + 1H to line up improves entries on daily signals.
# Actions tab -> "Multi-timeframe test" -> Run workflow (~10-20 min). Results in research/mtf.md.
name: Multi-timeframe test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  mtf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        env:
          SIGNAL_DESK_DB: /tmp/screen.db
        run: python mtf_research.py

      - name: Save results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mtf.md research/mtf.json
          git commit -m "Multi-timeframe test results" || exit 0
          git checkout -- .   # drop side files the test touched (e.g. ath.json) so the rebase can run
          ok=0; for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep 5; done; [ "$ok" = 1 ]
