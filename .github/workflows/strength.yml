# Is a Strong Buy actually stronger than a Buy? Compares the days at each signal level.
# Actions tab -> "Signal strength test" -> Run workflow (~10 min). Results in research/strength.md.
name: Signal strength test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  strength:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        env:
          SIGNAL_DESK_DB: /tmp/screen.db
        run: python strength_research.py

      - name: Save results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/strength.md research/strength.json
          git commit -m "Signal strength test results" || exit 0
          git checkout -- .   # drop side files the test touched (e.g. ath.json) so the rebase can run
          ok=0; for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep 5; done; [ "$ok" = 1 ]
