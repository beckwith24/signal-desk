# Rebuild the IA-Confluence-Model from the UMAC screenshot and test the best match on the watchlist.
# Actions tab -> "Confluence model test" -> Run workflow (~15 min). Results in research/confluence.md.
name: Confluence model test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  confluence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python conf_research.py

      - name: Save results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/confluence*
          git commit -m "Confluence model results" || exit 0
          git checkout -- .
          ok=0; for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep 5; done; [ "$ok" = 1 ]
