# Weekly trend rules (40-week average, 52-week momentum, weekly IA ribbon...) vs holding, stocks and crypto.
# Actions tab -> "Weekly trend test" -> Run workflow (~5 min). Results in research/weekly.md.
name: Weekly trend test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python weekly_research.py

      - name: Save results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/weekly*
          git commit -m "Weekly trend test results" || exit 0
          git checkout -- .
          ok=0; for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep 5; done; [ "$ok" = 1 ]
