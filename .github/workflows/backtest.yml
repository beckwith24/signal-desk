# Manual backtest: Actions tab → "Backtest" → Run workflow. Signals take ~15–25 minutes, the ladder ~3.
# Results are saved in the backtest/ folder (summary.md is the readable one).
name: Backtest

on:
  workflow_dispatch:
    inputs:
      run:
        description: "Which backtest"
        type: choice
        options: [both, signals, ladder]
        default: both
      timeframes:
        description: "Timeframes for the signal backtest (space separated)"
        default: "1d 4h 1h"

permissions:
  contents: write

concurrency:
  group: backtest-${{ inputs.run }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Signal backtest
        if: inputs.run != 'ladder'
        run: python backtest.py --tf ${{ inputs.timeframes }}

      - name: Layer-in / layer-out backtest
        if: inputs.run != 'signals'
        run: python backtest_ladder.py

      - name: Save results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/
          git commit -m "Backtest results" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
