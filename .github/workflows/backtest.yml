# Manual backtest: Actions tab → "Backtest" → Run workflow. Takes ~15–25 minutes.
# Results are saved in the backtest/ folder (summary.md is the readable one).
name: Backtest

on:
  workflow_dispatch:
    inputs:
      timeframes:
        description: "Timeframes (space separated)"
        default: "1d 4h 1h"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run backtest
        run: python backtest.py --tf ${{ inputs.timeframes }}

      - name: Save results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/
          git commit -m "Backtest results" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
