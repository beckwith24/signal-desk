# Lines up the digitised InvestAnswers screenshots (research/ia_targets/) with real prices and
# searches for the formulas behind them. Actions tab -> "IA calibration" -> Run workflow (~5 min).
name: IA calibration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install pandas numpy yfinance

      - name: Calibrate
        run: python calibrate_ia.py

      - name: Save results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/
          git commit -m "IA calibration results" || exit 0
          ok=0; for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep 5; done; [ "$ok" = 1 ]
