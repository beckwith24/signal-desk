# Which stocks (S&P 500, Nasdaq-100, growth names) are a Strong Buy today by the app's own signal, but not on the watchlist?
# Actions tab -> "Signal screen" -> Run workflow (~5 min). Results in research/signal_screen.md.
name: Signal screen

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt lxml

      - name: Screen
        env:
          SIGNAL_DESK_DB: /tmp/screen.db
        run: python screen_signals.py

      - name: Save results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/signal_screen.md research/signal_screen.json
          git commit -m "Signal screen results" || exit 0
          git checkout -- .   # drop side files the screen touched (e.g. ath.json) so the rebase can run
          ok=0; for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep 5; done; [ "$ok" = 1 ]
