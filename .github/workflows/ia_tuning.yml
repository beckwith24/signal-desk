# Does tuning the IA ATR Model per asset (the demo's way) hold up on later, unseen years?
# Actions tab -> "IA tuning test" -> Run workflow (~10 min). Results in research/ia_tuning.md.
name: IA tuning test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  tuning:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python ia_tuning_research.py

      - name: Save results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ia_tuning*
          git commit -m "IA tuning test results" || exit 0
          git checkout -- .
          ok=0; for i in 1 2 3; do git pull --rebase && git push && ok=1 && break; sleep 5; done; [ "$ok" = 1 ]
