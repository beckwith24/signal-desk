# Checks your Telegram bot chat every few minutes for /settings, /signals and button taps.
# Uses the same TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets as the scan.
name: Telegram controls

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may run this a few minutes late; that's normal
  workflow_dispatch:

permissions:
  contents: write           # to save settings.json

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Chart site address
        run: echo "PAGES_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas pyyaml requests

      - name: Handle Telegram messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save settings
        run: |
          [ -f settings.json ] || exit 0
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update settings from Telegram"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
