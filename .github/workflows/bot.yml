# Telegram controls: keeps a listener running so /settings, /signals and button taps are answered
# within seconds. Each session lasts 50 minutes; the schedule queues the next one so it starts as
# soon as the previous ends. Uses the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets.
name: Telegram controls

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write           # to save settings.json

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - name: Chart site address
        run: echo "PAGES_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas pyyaml requests

      - name: Listen to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_COMMIT: "1"
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python bot.py --listen 50
